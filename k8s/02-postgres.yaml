# Single-replica Postgres, same as docker-compose.yml's postgres service. A real
# production deployment would use a StatefulSet (or, more realistically, a managed
# Postgres service outside the cluster entirely) - a single Deployment+PVC is the
# right amount of ceremony for a local K3s demo of the same thing Compose already runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chess-game
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: chess-db-credentials }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "chessgame"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "chessgame"] }
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: chess-game
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chess-game
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
