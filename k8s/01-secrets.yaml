# Same credentials as docker-compose.yml's postgres service, just K8s-native instead
# of plain env vars in a compose file. In a real deployment these values would come
# from a secrets manager, not be checked into git - kept as plain base64 here only
# because they match docker-compose.yml's own already-public demo credentials.
apiVersion: v1
kind: Secret
metadata:
  name: chess-db-credentials
  namespace: chess-game
type: Opaque
data:
  POSTGRES_USER: Y2hlc3NnYW1l     # "chessgame"
  POSTGRES_PASSWORD: Y2hlc3NnYW1l # "chessgame"
  POSTGRES_DB: Y2hlc3NnYW1l       # "chessgame"
